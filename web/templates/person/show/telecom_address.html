<div class="card col-4">
        <div class="d-flex card-header">
            <b>{{ _("Telecom") }}</b>
            <a class="ms-auto" type="button" data-bs-toggle="dropdown"
                    data-bs-auto-close="outside">
                    <i class="fa-solid fa-plus"></i>
                    {{ _("Add") }}
            </a>
            <div class="dropdown dropend">
                <ul class="dropdown-menu">
                    <li class="dropdown-item">
                        <a class="ms-auto" href="{{ url_for('.telecom_address.new', person_id=person.id, scheme='mailto') }}">
                            <i class="fa-solid fa-plus"></i>
                            {{ _("Email") }}
                        </a>
                    </li>
                    <li class="dropdown-item">
                        <a class="ms-auto" href="{{ url_for('.telecom_address.new', person_id=person.id, scheme='tel') }}">
                            <i class="fa-solid fa-plus"></i>
                            {{ _("Number") }}
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <table class="table">
            <tbody>
                {% for tel in person.telecom_address %}
                <tr>
                    <td>{{ tel }}</td>
                    <td class="text-end">
                        <a href="{{ url_for('.telecom_address.edit', person_id=person.id, id=tel.id) }}">
                            <i class="fa-solid fa-pencil"></i>
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
